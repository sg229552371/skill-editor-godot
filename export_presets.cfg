; 导出预设（规格 §14「多平台与导出」）
;
; 两条硬要求：
;   1. Android 为必测平台，config/features 必须含 "Mobile"（已在 project.godot 加）
;   2. 所有平台共用同一套 .tres 与同一套逻辑，禁止用 if OS.has_feature("mobile") 分叉游戏规则
;
; 使用前需要在编辑器里装好对应平台的导出模板（Editor → Manage Export Templates）。
; 本文件只声明预设与参数，不含任何密钥：Android 签名由本地 keystore 提供，不提交到仓库。

